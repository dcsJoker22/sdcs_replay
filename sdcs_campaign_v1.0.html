<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic DCS — Campaign Overview v1.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script src="sdcs_shared.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;
  --text:#c9d1d9;--dim:#8b949e;--blue:#58a6ff;--red:#f85149;
  --green:#3fb950;--yellow:#d29922;--accent:#1f6feb;--r:6px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--panel);border-bottom:1px solid var(--border);
  padding:0 14px;display:flex;align-items:center;gap:10px;height:44px;flex-shrink:0;z-index:1000}
#topbar h1{font-size:13px;font-weight:700;color:#e27b3a;letter-spacing:.5px;white-space:nowrap}
#campaign-selector{background:var(--panel2);border:1px solid var(--border);
  color:var(--text);padding:3px 7px;border-radius:var(--r);font-size:12px;cursor:pointer;max-width:220px}
#session-badge{background:var(--panel2);border:1px solid var(--border);padding:2px 7px;
  border-radius:var(--r);font-size:11px;color:var(--dim);white-space:nowrap}
.sel-label{font-size:10px;color:var(--dim);white-space:nowrap}
#wallclock{font-size:13px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;
  margin-left:auto;white-space:nowrap}
#switch-btn{background:var(--panel2);border:1px solid var(--border);color:var(--blue);
  padding:3px 10px;border-radius:var(--r);font-size:11px;cursor:pointer;white-space:nowrap;
  transition:background .15s}
#switch-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#main{display:flex;flex:1;overflow:hidden}
#map{flex:1;background:#111;position:relative}
#sidebar{width:268px;background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sb-sec{border-bottom:1px solid var(--border);padding:9px 11px;flex-shrink:0}
.sb-sec h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:7px}
.frow{display:flex;align-items:center;gap:7px;margin-bottom:3px;cursor:pointer;user-select:none;font-size:14px}
.frow input[type=checkbox]{accent-color:var(--blue);width:12px;height:12px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#players-section{flex:0 0 auto;display:flex;flex-direction:column;min-height:0;max-height:40%;border-bottom:1px solid var(--border)}
#players-header{padding:7px 11px 5px;flex-shrink:0;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
#players-list{overflow-y:auto;padding:5px 9px 9px}
.pcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);
  padding:8px 9px;margin-bottom:5px;transition:border-color .15s,background .15s}
.pc-hd{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.pc-cs{font-weight:700;font-size:13px;flex:1}
.pc-tag{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:600;flex-shrink:0}
.tag-blue{background:rgba(88,166,255,.2);color:var(--blue)}
.tag-red{background:rgba(248,81,73,.2);color:var(--red)}
.pc-st{color:var(--dim);font-size:11px;display:flex;gap:7px;flex-wrap:wrap}
#killfeed-section{flex:1;display:flex;flex-direction:column;min-height:0}
#killfeed-header{padding:7px 11px 5px;flex-shrink:0;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);border-bottom:1px solid var(--border)}
#killfeed-list{flex:1;overflow-y:auto;padding:5px 9px 9px}
.kf-row{background:var(--bg);border:1px solid var(--border);border-radius:5px;
  padding:5px 8px;margin-bottom:4px;font-size:11px;transition:opacity 2s ease,box-shadow .3s}
.kf-row.pvp-blue{border-color:rgba(88,166,255,.5);background:rgba(88,166,255,.07);animation:pvp-flash-blue 1.4s ease-out}
.kf-row.pvp-red{border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.07);animation:pvp-flash-red 1.4s ease-out}
@keyframes pvp-flash-blue{0%,20%,40%,60%{box-shadow:0 0 10px 2px rgba(88,166,255,.7)}10%,30%,50%,70%{box-shadow:0 0 3px rgba(88,166,255,.1)}100%{box-shadow:none}}
@keyframes pvp-flash-red{0%,20%,40%,60%{box-shadow:0 0 10px 2px rgba(248,81,73,.7)}10%,30%,50%,70%{box-shadow:0 0 3px rgba(248,81,73,.1)}100%{box-shadow:none}}
.kf-killer{font-weight:700}.kf-ac{color:var(--dim);font-size:10px}
.kf-victim{color:var(--text);font-style:italic}.kf-weapon{color:var(--dim);font-size:10px}
.kf-time{color:var(--dim);font-size:10px;float:right}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
#timeline-bar{background:var(--panel);border-top:1px solid var(--border);padding:7px 13px 9px;flex-shrink:0}
#tl-controls{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.cbtn{background:var(--border);border:none;color:var(--text);padding:3px 8px;
  border-radius:4px;cursor:pointer;font-size:12px;transition:background .1s;flex-shrink:0}
.cbtn:hover{background:#444c56}.cbtn.active{background:var(--accent);color:#fff}
.spdbtn{font-size:11px;font-weight:700;min-width:36px;padding:3px 5px}
#tl-time{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
#scrubber-wrap{position:relative;height:34px}
#tl-bg{position:absolute;top:13px;left:0;right:0;height:8px;background:var(--border);border-radius:4px;pointer-events:none;z-index:1}
#tl-sessions{position:absolute;top:13px;left:0;right:0;height:8px;border-radius:4px;pointer-events:none;z-index:2;overflow:hidden}
#tl-events{position:absolute;top:0;left:0;right:0;height:34px;pointer-events:none;z-index:2}
.tpip{position:absolute;width:3px;border-radius:1px;top:5px;height:22px;transform:translateX(-50%);pointer-events:all;cursor:pointer;opacity:.85}
.sess-lbl{position:absolute;top:23px;font-size:9px;color:var(--dim);transform:translateX(-50%);white-space:nowrap;pointer-events:none}
#scrubber{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:transparent;
  outline:none;position:absolute;top:15px;cursor:pointer;z-index:3}
#scrubber::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--blue);border:2px solid var(--bg);box-shadow:0 0 5px rgba(88,166,255,.6);cursor:pointer}
#ui-scale-ctrl{position:absolute;top:13px;left:54px;z-index:1000;background:#fff;
  border:2px solid rgba(0,0,0,.3);border-radius:4px;padding:4px 8px 5px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 1px 5px rgba(0,0,0,.4);pointer-events:all;}
#ui-scale-ctrl label{font-size:9px;font-weight:700;color:#000;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;}
#ui-scale-val{font-size:9px;font-weight:700;color:#000;min-width:28px;text-align:center;}
#ui-scale-row{display:flex;align-items:center;gap:5px}
#ui-scale{-webkit-appearance:none;appearance:none;width:72px;height:3px;border-radius:2px;outline:none;cursor:pointer;}
#ui-scale::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:#fff;border:1px solid #000;box-shadow:0 1px 1px rgba(0,0,0,.8);cursor:pointer;transition:transform .1s;}
#ui-scale::-webkit-slider-thumb:hover{transform:scale(1.25)}
#detail-panel{display:none;position:absolute;top:54px;right:276px;width:258px;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:13px;z-index:2000;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#detail-panel h2{font-size:14px;font-weight:700}
.dp-sub{color:var(--dim);font-size:11px;margin:3px 0 11px}
.dp-sec{margin-bottom:9px}
.dp-sec h4{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:4px}
.kill-row{background:var(--bg);border-radius:4px;padding:4px 7px;margin-bottom:3px;font-size:11px}
.kill-row b{display:block;margin-bottom:1px}.kill-row span{color:var(--dim)}
#close-dp{float:right;background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;line-height:1;padding:0;margin-top:-2px}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:9999;gap:13px}
#loading h2{color:var(--blue);font-size:18px}
#loading p{color:var(--dim);font-size:12px}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#obj-counter{position:absolute;bottom:15px;left:15px;z-index:900;pointer-events:none;
  background:rgba(10,12,18,.82);border:1px solid rgba(255,255,255,.1);
  border-radius:7px;padding:11px 16px;min-width:264px;backdrop-filter:blur(4px)}
.obj-title{font-size:13px;font-weight:700;letter-spacing:.5px;margin-bottom:3px}
.obj-title.blue{color:#58a6ff}.obj-title.red{color:#f85149}
.obj-bar-wrap{background:rgba(255,255,255,.08);border-radius:3px;height:8px;margin-bottom:8px;overflow:hidden}
.obj-bar{height:100%;border-radius:3px;transition:width .6s ease}
.obj-bar.blue{background:#4499ff}.obj-bar.red{background:#ff4433}
.leaflet-tooltip{background:var(--panel)!important;border:1px solid var(--border)!important;
  color:var(--text)!important;font-size:11px!important;border-radius:4px!important;
  padding:3px 7px!important;box-shadow:0 2px 8px rgba(0,0,0,.4)!important}
.blabel{background:none!important;border:none!important;box-shadow:none!important;padding:0!important;pointer-events:none}
.blabel-name{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;font-weight:700;white-space:nowrap;
  text-shadow:0 0 4px #000,0 0 8px #000,-1px -1px 0 #000,1px 1px 0 #000,0 1px 0 #000,0 -1px 0 #000}
.blabel-name.blue{color:#58a6ff}.blabel-name.red{color:#f85149}.blabel-name.neutral{color:#aaaaaa}
.glabel{background:none!important;border:none!important;box-shadow:none!important;padding:0!important;pointer-events:none}
.glabel-name{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;font-weight:600;
  text-shadow:0 0 3px #000,0 0 3px #000,-1px -1px 2px #000,1px 1px 2px #000;white-space:nowrap}
.glabel-name.blue{color:#58a6ff}.glabel-name.red{color:#f85149}
.expmark{background:none!important;border:none!important;box-shadow:none!important;pointer-events:none}
@keyframes er1{0%{transform:translate(-50%,-50%) scale(.1);opacity:1}60%{opacity:.8}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes er2{0%{transform:translate(-50%,-50%) scale(.1);opacity:.7}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
@keyframes ec{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}30%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-50%) scale(.6);opacity:0}}
@keyframes esk{0%{transform:translate(-50%,-50%) scale(0) rotate(0deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.2) rotate(15deg);opacity:0}}
#sidebar-toggle{display:none}
@media(max-width:768px){
  #topbar{flex-wrap:wrap;height:auto;padding:6px 10px;gap:6px}
  #topbar h1{font-size:12px}#campaign-selector{max-width:140px;font-size:11px}
  #wallclock{margin-left:0;font-size:12px}#session-badge{font-size:10px}
  #sidebar-toggle{display:flex;align-items:center;justify-content:center;
    position:fixed;bottom:90px;right:12px;z-index:3000;width:44px;height:44px;border-radius:50%;
    background:var(--accent);border:none;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5);}
  #sidebar{position:fixed;top:0;right:0;bottom:0;width:85vw;max-width:300px;
    transform:translateX(100%);transition:transform .25s ease;z-index:2500;border-left:1px solid var(--border);}
  #sidebar.open{transform:translateX(0)}
  #timeline-bar{padding:8px 10px 10px}
  .cbtn{padding:7px 10px;font-size:14px;min-width:36px}
  .spdbtn{font-size:12px;min-width:40px;padding:7px 6px}
  #tl-controls{gap:6px;flex-wrap:wrap}
  #tl-time{font-size:12px;width:100%;text-align:right;margin-left:0}
  #scrubber::-webkit-slider-thumb{width:20px;height:20px}
  #obj-counter{min-width:0;width:calc(100vw - 80px);padding:8px 10px;font-size:11px}
}
</style>
</head>
<body>
<button id="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open');this.textContent=document.getElementById('sidebar').classList.contains('open')?'✕':'☰'">☰</button>
<div id="loading"><div class="spin"></div><h2>Strategic DCS — Campaign Overview</h2><p id="load-msg">Initialising…</p></div>

<div id="topbar">
  <h1><a href="https://map.strategic-dcs.com/map" target="_blank" style="color:#fd8310;text-decoration:none"><img src="public/Logo_4.1.png" alt="" style="height:32px;width:32px;object-fit:contain;vertical-align:middle;margin-right:8px">SDCS CAMPAIGN</a></h1>
  <span class="sel-label">CAMPAIGN</span>
  <select id="campaign-selector"><option>Loading…</option></select>
  <span id="session-badge">—</span>
  <button id="switch-btn" onclick="switchToSession()">⇄ Session View</button>
  <a href="https://map.strategic-dcs.com/map" target="_blank" style="background:var(--panel2);border:1px solid var(--border);color:#fd8310;padding:3px 10px;border-radius:var(--r);font-size:11px;cursor:pointer;white-space:nowrap;text-decoration:none">🗺 Live Map</a>
  <div id="wallclock">—</div>
</div>

<div id="main">
  <div id="map">
    <div id="ui-scale-ctrl">
      <div id="ui-scale-row">
        <input type="range" id="ui-scale" min="0.5" max="2" step="0.01" value="1">
        <span id="ui-scale-val">1×</span>
      </div>
      <label style="color:#000">UI Scale</label>
    </div>
    <div id="obj-counter">
      <div class="obj-title blue" id="obj-blue-title">Blue team controls — / — Objectives</div>
      <div class="obj-bar-wrap"><div class="obj-bar blue" id="obj-blue-bar" style="width:0%"></div></div>
      <div class="obj-title red" id="obj-red-title">Red team controls — / — Objectives</div>
      <div class="obj-bar-wrap"><div class="obj-bar red" id="obj-red-bar" style="width:0%"></div></div>
      <div style="border-top:1px solid rgba(255,255,255,0.1);margin:6px 0 5px"></div>
      <div class="obj-title blue" id="total-kill-blue-title">Campaign Blue: 0</div>
      <div class="obj-bar-wrap"><div class="obj-bar blue" id="total-kill-blue-bar" style="width:0%"></div></div>
      <div class="obj-title red" id="total-kill-red-title">Campaign Red: 0</div>
      <div class="obj-bar-wrap"><div class="obj-bar red" id="total-kill-red-bar" style="width:0%"></div></div>
    </div>
  </div>

  <div id="sidebar">
    <div class="sb-sec">
      <h3>Display Layers</h3>
      <label class="frow"><input type="checkbox" id="f-ground" checked><span class="dot" style="background:#3fb950"></span>Ground Vehicles</label>
      <label class="frow" style="padding-left:18px"><input type="checkbox" id="f-ground-labels"><span class="dot" style="background:#3fb950;opacity:.6"></span>Ground Labels</label>
      <label class="frow"><input type="checkbox" id="f-kills" checked><span class="dot" style="background:#f85149"></span>Kill Events</label>
      <label class="frow"><input type="checkbox" id="f-heatmap" checked><span class="dot" style="background:#ff6600;border-radius:2px"></span>Kill Heatmap (FLOT)</label>
      <label class="frow"><input type="checkbox" id="f-bases" checked><span class="dot" style="background:#d29922"></span>Bases / FARPs</label>
      <label class="frow" style="padding-left:18px"><input type="checkbox" id="f-bases-only" checked><span class="dot" style="background:#d29922;opacity:.6"></span>Bases</label>
      <label class="frow" style="padding-left:18px"><input type="checkbox" id="f-farps-only" checked><span class="dot" style="background:#d29922;opacity:.6"></span>FARPs &amp; Factories</label>
    </div>
    <div id="players-section">
      <div id="players-header" style="display:flex;align-items:center;justify-content:space-between;padding-right:9px"><span>Players This Campaign</span><div style="display:flex;gap:3px"><button id="sort-az-btn" style="background:var(--accent);border:1px solid var(--border);color:#fff;font-size:9px;padding:1px 6px;border-radius:3px;cursor:pointer" title="Sort A-Z">A-Z</button><button id="sort-kills-btn" style="background:none;border:1px solid var(--border);color:var(--dim);font-size:9px;padding:1px 6px;border-radius:3px;cursor:pointer" title="Sort by kills">💀</button></div></div>
      <div id="players-list"></div>
    </div>
    <div id="killfeed-section">
      <div id="killfeed-header">Kill Feed</div>
      <div id="killfeed-list"><div style="color:var(--dim);font-size:11px;padding:4px 0">No kills yet</div></div>
    </div>
  </div>
</div>

<div id="timeline-bar">
  <div id="tl-controls">
    <button class="cbtn" id="btn-prev">⏮</button>
    <button class="cbtn" id="btn-play">▶</button>
    <button class="cbtn" id="btn-pause" title="Pause">⏸</button>
    <button class="cbtn" id="btn-next">⏭</button>
    <button class="cbtn spdbtn" data-spd="1">1×</button>
    <button class="cbtn spdbtn" data-spd="5">5×</button>
    <button class="cbtn spdbtn" data-spd="10">10×</button>
    <button class="cbtn spdbtn active" data-spd="30">30×</button>
    <button class="cbtn spdbtn" data-spd="100">100×</button>
    <button class="cbtn spdbtn" data-spd="300">300×</button>
    <button class="cbtn spdbtn" data-spd="500">500×</button>
    <button class="cbtn spdbtn" data-spd="1000">1000×</button>
    <button class="cbtn spdbtn" data-spd="3000">3000×</button>
    <button class="cbtn spdbtn" data-spd="5000">5000×</button>
    <span id="tl-time">0:00:00 / 0:00:00</span>
  </div>
  <div id="scrubber-wrap">
    <div id="tl-bg"></div>
    <div id="tl-sessions"></div>
    <div id="tl-events"></div>
    <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1">
  </div>
</div>

<div id="detail-panel">
  <button id="close-dp">×</button>
  <h2 id="dp-cs"></h2><div class="dp-sub" id="dp-sub"></div>
  <div class="dp-sec"><h4>Kill Events</h4><div id="dp-kills" style="max-height:260px;overflow-y:auto"></div></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════════
let CAMPAIGNS_DATA = null;
const SDCS_API = null;

function switchToSession() {
  const sel = document.getElementById('campaign-selector');
  const campIdx = parseInt(sel.value);
  const url = 'index.html' + (!isNaN(campIdx) ? '?campIdx=' + campIdx : '');
  window.location.href = url;
}

// ════════════════════════════════════════════════════════════════════
//  UI SCALE
// ════════════════════════════════════════════════════════════════════
let UI_SCALE = 1.0;

const map = L.map('map',{center:[51.68,10.5],zoom:7,zoomControl:true,attributionControl:false,
  zoomDelta:0.65,zoomSnap:0.65,wheelPxPerZoomLevel:170});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{maxZoom:18,opacity:0.45,subdomains:'abcd'}).addTo(map);
map.createPane('basePane');   map.getPane('basePane').style.zIndex=330;
map.getPane('basePane').style.mixBlendMode='screen';
map.createPane('flotPane');   map.getPane('flotPane').style.zIndex=320;
map.createPane('heatPane');   map.getPane('heatPane').style.zIndex=290;
map.createPane('blabelPane'); map.getPane('blabelPane').style.zIndex=340;
map.createPane('glabelPane'); map.getPane('glabelPane').style.zIndex=610;
map.createPane('aiPane');     map.getPane('aiPane').style.zIndex=620;
map.createPane('wpnPane');    map.getPane('wpnPane').style.zIndex=350;
map.createPane('wlabelPane'); map.getPane('wlabelPane').style.zIndex=630;
map.createPane('plabelPane'); map.getPane('plabelPane').style.zIndex=640;

// ════════════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════════════
let _campaignIndex = null;   // campaign_index_*.json  (lightweight, loaded first)
let _sessions      = [];     // array of loaded campaign_session_*.json data
let _activeSession = null;   // the session object currently being rendered
let _activeIdx     = -1;     // index of active session in _sessions
let _activating    = false;  // guard against concurrent activateSession calls
let _allEvents     = [];     // all events across campaign (from index, for heatmap/kills)

let currentTime = 0, campaignDur = 0, playing = false, playSpeed = 30;

async function loadCampaignsJSON(){
  try {
    const r = await fetch('public/campaigns.json');
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    CAMPAIGNS_DATA = await r.json();
    return CAMPAIGNS_DATA;
  } catch(e) {
    console.warn('campaigns.json not found:', e.message);
    CAMPAIGNS_DATA = { campaigns: [] };
    return CAMPAIGNS_DATA;
  }
}

function populateSelector(){
  const campSel = document.getElementById('campaign-selector');
  const campaigns = CAMPAIGNS_DATA.campaigns || [];
  campSel.innerHTML = '';
  if(!campaigns.length){ campSel.innerHTML = '<option>No campaigns</option>'; return; }
  const indexed = campaigns.map((camp, i) => ({camp, i}));
  indexed.sort((a, b) => {
    const da = a.camp.date ? new Date(a.camp.date)
      : a.camp.sessions?.length ? new Date(a.camp.sessions[a.camp.sessions.length-1].date||0) : 0;
    const db = b.camp.date ? new Date(b.camp.date)
      : b.camp.sessions?.length ? new Date(b.camp.sessions[b.camp.sessions.length-1].date||0) : 0;
    return db - da;
  });
  indexed.forEach(({camp, i}) => {
    const o = document.createElement('option');
    o.value = i;
    let campLabel = camp.name || camp.id;
    if(camp.date){
      const d = new Date(camp.date);
      if(!isNaN(d)){
        const yr = d.getUTCFullYear();
        const mo = String(d.getUTCMonth()+1).padStart(2,'0');
        const dy = String(d.getUTCDate()).padStart(2,'0');
        campLabel = `${yr}/${mo}/${dy} — ${camp.name}`;
      }
    }
    o.textContent = campLabel;
    campSel.appendChild(o);
  });
  const params = new URLSearchParams(window.location.search);
  const reqIdx = params.get('campIdx');
  if(reqIdx !== null){ const opt = Array.from(campSel.options).find(o => o.value === reqIdx); if(opt) campSel.value = reqIdx; }
  campSel.addEventListener('change', () => loadCampaign(parseInt(campSel.value)));
  loadCampaign(parseInt(campSel.value));
}

// ════════════════════════════════════════════════════════════════════
//  CAMPAIGN LOADING — per-session architecture
// ════════════════════════════════════════════════════════════════════
async function loadCampaign(campIdx) {
  const camp = (CAMPAIGNS_DATA.campaigns || [])[campIdx];
  if(!camp) return;

  setLoad(`Loading ${camp.name}…`);
  document.getElementById('loading').style.display = 'flex';
  clearAll();
  currentTime = 0;
  _campaignIndex = null;
  _sessions = [];
  _activeSession = null;
  _activeIdx = -1;
  _allEvents = [];

  // Derive folder from first session file path
  const firstSession = (camp.sessions || [])[0];
  if(!firstSession){ setLoad('No sessions found.'); return; }
  const folder = firstSession.file.substring(0, firstSession.file.lastIndexOf('/'));
  const folderName = folder.split('/').pop();

  // 1. Load campaign index (lightweight)
  const indexPath = ('public/' + folder + '/campaign_index_' + folderName + '.json').replace(/ /g, '%20');
  try {
    setLoad('Loading campaign index…');
    const r = await fetch(indexPath);
    if(!r.ok) throw new Error(`campaign_index not found (HTTP ${r.status}). Run build_campaign_viewer.py first.`);
    _campaignIndex = await r.json();
  } catch(e) {
    setLoad('Error: ' + e.message); console.error(e);
    document.getElementById('loading').style.display = 'none'; return;
  }

  campaignDur = _campaignIndex.total_duration || 0;
  _allEvents  = ((_campaignIndex.events || []).slice()).sort((a,b)=>a.t-b.t);

  // 2. Load all campaign_session files in parallel
  const sessionEntries = _campaignIndex.session_index || [];
  setLoad(`Loading ${sessionEntries.length} sessions…`);

  const fetches = sessionEntries.map((entry, i) =>
    fetch(('public/' + entry.file).replace(/ /g, '%20'))
      .then(r => { if(!r.ok) throw new Error(`HTTP ${r.status} for ${entry.file}`); return r.json(); })
      .then(data => ({ idx: i, entry, data }))
      .catch(e => { console.warn(`Session ${i} failed:`, e); return null; })
  );
  const results = await Promise.all(fetches);

  _sessions = results
    .filter(r => r !== null)
    .sort((a, b) => a.idx - b.idx)
    .map(r => ({
      ...r.data,
      _offset:   r.entry.offset,
      _duration: r.entry.duration,
      _label:    r.entry.label,
      _date:     r.entry.date,
      _ref_time: r.entry.reference_time,
    }));

  if(!_sessions.length){
    setLoad('No session data loaded.'); return;
  }

  // 3. Build heatmap kill points from all events in the index
  _killPoints = [];
  for(const ev of _allEvents){
    if(ev.type !== 'kill' && ev.type !== 'crashed') continue;
    if(ev.lat && ev.lon) _killPoints.push({lat:ev.lat, lon:ev.lon, t:ev.t});
  }

  // 4. Build player colours and kill summaries from all events
  const playerKills = {};
  for(const ev of _allEvents){
    if(ev.type !== 'kill' || !ev.killer || /^\d+/.test(ev.killer)) continue;
    if(!playerColors[ev.killer])
      playerColors[ev.killer] = ev.victim_coalition === 'Hostiles' ? '#58a6ff' : '#f85149';
    if(!playerKills[ev.killer]) playerKills[ev.killer] = {kills:[], coalition:null};
    playerKills[ev.killer].kills.push(ev);
    if(!playerKills[ev.killer].coalition)
      playerKills[ev.killer].coalition = ev.victim_coalition === 'Hostiles' ? 'Friendlies' : 'Hostiles';
  }

  // 5. Activate the first session to initialise map state
  await activateSession(0, camp);

  // 6. Build player list (uses all events, not just active session)
  const allPlayersMerged = { _dp: {} };
  for(const [cs, pd] of Object.entries(playerKills))
    allPlayersMerged._dp[cs] = {callsign:cs, flights:[], kills:pd.kills, deaths:0, coalition:pd.coalition};
  buildPlayerList(allPlayersMerged);

  // Timeline + badge
  const scrubEl = document.getElementById('scrubber');
  scrubEl.min = 0; scrubEl.max = campaignDur; currentTime = 0;
  drawTimeline();

  const nSess = _sessions.length;
  document.getElementById('session-badge').textContent =
    `${nSess} session${nSess!==1?'s':''} · ${fmtDur(campaignDur)}`;

  // Centre map
  const MAP_NAMES = {
    'persian gulf':189,'persiangulf':189,'gulf':189,'caucasus':190,'georgia':190,
    'germany':192,'syria':185,'sinai':185,'nevada':194,'nttr':194,'marianas':195,
    'south atlantic':196,'falklands':196,
  };
  let mcKey = camp.campaign_id;
  if(!MAP_CENTRES[mcKey]){
    const mk=(camp.map||'').toLowerCase().replace(/[^a-z]/g,'');
    mcKey=MAP_NAMES[mk]||MAP_NAMES[(camp.map||'').toLowerCase()];
  }
  const mc = MAP_CENTRES[mcKey];
  if(mc) map.setView([mc.lat, mc.lon], mc.zoom);

  document.getElementById('loading').style.display = 'none';
  seekTo(0);
}

// Activate a session by index — rebuilds _merged, re-inits units and bases
async function activateSession(sessIdx, camp) {
  if(sessIdx === _activeIdx) return;  // already active
  if(_activating) return;             // prevent concurrent activations
  _activating = true;

  const sess = _sessions[sessIdx];
  if(!sess){ _activating = false; return; }

  // Clear unit markers and trails but keep base markers
  for(const x of [...Object.values(unitMarkers), ...Object.values(groundLabels), ...killLayers])
    try{map.removeLayer(x)}catch(e){}
  for(const segs of Object.values(unitTrails)) for(const p of segs) try{map.removeLayer(p)}catch(e){}
  for(const d of [unitMarkers, unitTrails, groundLabels]) Object.keys(d).forEach(k=>delete d[k]);
  killLayers.length = 0; shownKills.clear(); shownKillFeed.clear();
  for(const k of Object.keys(groundKillTimes)) delete groundKillTimes[k];
  for(const k of Object.keys(unitHideTimes))   delete unitHideTimes[k];
  for(const k of Object.keys(baseKillTimes))   delete baseKillTimes[k];
  killFeedEntries.length = 0;
  document.getElementById('killfeed-list').innerHTML =
    '<div style="color:var(--dim);font-size:11px;padding:4px 0">No kills yet</div>';

  _activeSession = sess;
  _activeIdx = sessIdx;

  // Build _merged from this session for shared functions
  _merged = {
    objects:        sess.objects  || {},
    tracks:         sess.tracks   || {},
    events:         sess.events   || [],
    statics:        sess.statics  || [],
    players:        {},
    _dp:            {},
    _campaignId:    camp ? camp.campaign_id : (_merged?._campaignId || 0),
    _currentSessionFile: null,
    _sessionOffset: sess._offset || 0,
  };

  // Force immediate base ownership update on session switch
  _lastSlowUpdate = -9999;
  for(const k of Object.keys(_baseOwnerCache)) delete _baseOwnerCache[k];

  buildShelterMap();
  buildGroundKillTimes();
  initUnits(_merged);

  // Reinit bases every session — FARPs and factories change between sessions
  const campId = camp ? camp.campaign_id : (_merged?._campaignId || 0);
  // Clear existing base markers before reinit
  for(const x of [...Object.values(baseMarkers),...Object.values(baseCircles),...Object.values(baseInnerCircles),...Object.values(baseLabels)])
    try{map.removeLayer(x)}catch(e){}
  for(const d of [baseMarkers,baseCircles,baseInnerCircles,baseLabels]) Object.keys(d).forEach(k=>delete d[k]);
  _baseList=[];
  if(campId) await initBases(_merged, campId);
  _activating = false;
}

//  CLEAR ALL

function clearAll(){
  for(const x of [
    ...Object.values(unitMarkers), ...Object.values(groundLabels),
    ...Object.values(baseMarkers), ...Object.values(baseCircles),
    ...Object.values(baseInnerCircles), ...Object.values(baseLabels),
    ...killLayers,
  ]) try{map.removeLayer(x)}catch(e){}
  for(const segs of Object.values(unitTrails)) for(const p of segs) try{map.removeLayer(p)}catch(e){}
  for(const d of [unitMarkers,unitTrails,groundLabels,baseMarkers,baseCircles,baseInnerCircles,baseLabels])
    Object.keys(d).forEach(k=>delete d[k]);
  killLayers.length=0; shownKills.clear(); shownKillFeed.clear();
  for(const k of Object.keys(groundKillTimes)) delete groundKillTimes[k];
  for(const k of Object.keys(unitHideTimes))   delete unitHideTimes[k];
  for(const k of Object.keys(baseKillTimes))   delete baseKillTimes[k];
  for(const k of Object.keys(playerColors))    delete playerColors[k];
  killFeedEntries.length=0;
  document.getElementById('killfeed-list').innerHTML=
    '<div style="color:var(--dim);font-size:11px;padding:4px 0">No kills yet</div>';
  document.getElementById('players-list').innerHTML='';
  if(_heatLayer){map.removeLayer(_heatLayer);_heatLayer=null;}
  _killPoints=[]; _merged=null; _baseList=[]; _shelter3Map={};
  for(const k of Object.keys(_baseOwnerCache)) delete _baseOwnerCache[k];
}

// ════════════════════════════════════════════════════════════════════
//  UNIT INIT & UPDATE
// ════════════════════════════════════════════════════════════════════
function initUnits(merged){
  for(const [id,track] of Object.entries(merged.tracks)){
    if(!track.length) continue;
    const obj=merged.objects[id]; if(!obj) continue;
    if(!isGroundVehicle(obj)) continue;
    const pt0=track[0]; const blue=obj.coalition==='Friendlies';
    const marker=L.marker([pt0.lat,pt0.lon],{
      icon:leafletIcon('ground',obj.name,obj.coalition,null,false,false,true),zIndexOffset:0});
    const dispNm=isSAMUnit(obj)?samDisplayName(obj.name):obj.name;
    marker.bindTooltip(dispNm,{direction:'top',offset:[0,-6]});
    marker.addTo(map);marker._vis=false;marker.setOpacity(0);marker._idx=0;
    unitMarkers[id]=marker;
    const gclr=blue?'blue':'red';
    const gFS=Math.round(11*UI_SCALE);
    const glblHtml=`<div class="glabel-name ${gclr}" style="font-size:${gFS}px">${dispNm}</div>`;
    const glblIcon=L.divIcon({html:glblHtml,className:'glabel',iconSize:[120,14],iconAnchor:[-9,7]});
    const glbl=L.marker([pt0.lat,pt0.lon],{icon:glblIcon,pane:'glabelPane',interactive:false});
    glbl._vis=false; groundLabels[id]=glbl;
    const trailColor=blue?'#1e6bb8':'#c42b20';
    const TRAIL_SEGS=6; const trailSegs=[];
    for(let s=0;s<TRAIL_SEGS;s++){
      const op=0.12+0.55*(s/(TRAIL_SEGS-1));
      trailSegs.push(L.polyline([],{color:trailColor,weight:2,opacity:op,smoothFactor:1}).addTo(map));
    }
    unitTrails[id]=trailSegs;
  }
}

// ════════════════════════════════════════════════════════════════════
//  KILL COUNTER
// ════════════════════════════════════════════════════════════════════
function updateKillCounter() {
  // Campaign kills: count all player kills up to currentTime across all sessions
  let campBlue=0, campRed=0;
  for(const ev of _allEvents){
    if(ev.t > currentTime) break;
    if(ev.type !== 'kill') continue;
    if(!ev.killer || /^\d+/.test(ev.killer)) continue;
    if(ev.victim_coalition === 'Hostiles')    campBlue++;
    else if(ev.victim_coalition === 'Friendlies') campRed++;
  }
  const campTotal=campBlue+campRed||1;
  document.getElementById('total-kill-blue-title').textContent=`Campaign Blue: ${campBlue}`;
  document.getElementById('total-kill-red-title').textContent =`Campaign Red: ${campRed}`;
  document.getElementById('total-kill-blue-bar').style.width=(campBlue/campTotal*100)+'%';
  document.getElementById('total-kill-red-bar').style.width =(campRed /campTotal*100)+'%';
}

// updateBaseOwnership — identical to current version, uses _merged
const _baseOwnerCache = {};

function updateBaseOwnership(t){
  for(const b of _baseList){
    const circ = baseCircles[b.key];
    const mk   = baseMarkers[b.key];
    const lbl  = baseLabels[b.key];
    const innerCirc = baseInnerCircles[b.key];

    // ── FARPs and Factories: visibility/fade only, colour does not change ──
    if(b.isFarp || b.isFactory){
      if((b.isFarp || b.isFactory) && b.firstSeen > 0 && t < b.firstSeen){
        if(circ) circ.setStyle({opacity:0, fillOpacity:0});
        if(mk)   mk.setOpacity(0);
        if(lbl)  lbl.setOpacity(0);
        continue;
      }
      const killT = baseKillTimes[b.key];
      const op = killT == null ? 1
        : t >= killT + 60 ? 0
        : t >= killT ? Math.max(0, 1-(t-killT)/60)
        : 1;
      if(circ)  circ.setStyle({opacity: op*0.5, fillOpacity: op*(b.isFactory?0.06:0.05)});
      if(mk)    mk.setOpacity(op);
      if(lbl)   lbl.setOpacity(op);
      continue;
    }

    // ── Bases and objectives: colour driven by Shelter3 ownership ──
    const owner  = baseOwnerAt(b.key, t);
    if(_baseOwnerCache[b.key] === owner) continue;
    _baseOwnerCache[b.key] = owner;
    const isBlue = owner === 'Friendlies';
    const isRed  = owner === 'Hostiles';
    const color  = isBlue ? '#58a6ff' : isRed ? '#f85149' : '#888888';

    // Update circle colour
    if(circ) circ.setStyle({color, fillColor:color});
    if(innerCirc) innerCirc.setStyle({color});

    // Redraw marker icon with new team colour
    if(mk){
      b.coalition = owner; // keep _baseList in sync for FLOT
      const isAB = b.type === 'airbase';
      let shp;
      if(isAB){
        shp=`<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13">
          <rect x="1" y="1" width="11" height="11" rx="2" fill="${color}" opacity=".9"/>
          <line x1="6.5" y1="1" x2="6.5" y2="12" stroke="#000" stroke-width=".8" opacity=".4"/>
          <line x1="1" y1="6.5" x2="12" y2="6.5" stroke="#000" stroke-width=".8" opacity=".4"/>
        </svg>`;
      } else {
        shp=`<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10">
          <polygon points="5,0 10,5 5,10 0,5" fill="${color}" opacity=".85"/>
        </svg>`;
      }
      const sz = isAB ? 13 : 11;
      mk.setIcon(L.divIcon({html:shp,className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]}));
    }
    // Update label text colour
    if(lbl){
      const nameEl = lbl.getElement()?.querySelector('.blabel-name');
      if(nameEl) nameEl.className = `blabel-name ${isBlue?'blue':isRed?'red':'neutral'}`;
    }
  }
  // ── Objective counter ────────────────────────────────────────────
  let blueCount=0, redCount=0, total=0;
  for(const b of _baseList){
    if(b.isFarp||b.isFactory) continue;
    if(SCORE_EXCLUDE_KEYS.has(b.key)) continue;
    total++;
    const owner = b.key ? baseOwnerAt(b.key, t) : b.coalition;
    if(owner==='Friendlies') blueCount++;
    else if(owner==='Hostiles') redCount++;
  }
  const blueTitle=document.getElementById('obj-blue-title');
  const redTitle =document.getElementById('obj-red-title');
  const blueBar  =document.getElementById('obj-blue-bar');
  const redBar   =document.getElementById('obj-red-bar');
  if(blueTitle&&total>0){
    blueTitle.textContent=`Blue team controls ${blueCount} / ${total} Objectives`;
    redTitle.textContent =`Red team controls ${redCount} / ${total} Objectives`;
    blueBar.style.width=`${(blueCount/total)*100}%`;
    redBar.style.width =`${(redCount/total)*100}%`;
  }
}


// buildPlayerList — identical to current version
let _playerSortByKills = false;
let _lastPlayerMerged = null;
function buildPlayerList(merged){
  if(merged) _lastPlayerMerged = merged;
  const src = _lastPlayerMerged || merged;
  if(!src || !src._dp) return;
  const cont=document.getElementById('players-list'); cont.innerHTML='';
  const entries=Object.entries(src._dp)
    .filter(([cs,p])=>p.kills.length>0)
    .sort((a,b)=>_playerSortByKills
      ? b[1].kills.length-a[1].kills.length
      : a[0].localeCompare(b[0]));
  for(const [cs,p] of entries){
    const blue=p.coalition==='Friendlies';
    playerColors[cs]=blue?'#58a6ff':'#f85149';
    const card=document.createElement('div');
    card.className='pcard'; card.dataset.cs=cs;
    card.innerHTML=`<div class="pc-hd"><span class="pc-cs">${cs}</span>
      <span class="pc-tag ${blue?'tag-blue':'tag-red'}">${blue?'BLUE':'RED'}</span></div>
      <div class="pc-st"><span>💥 ${p.kills.length} kill${p.kills.length!==1?'s':''}</span></div>`;
    card.addEventListener('click',()=>openDetail(cs,p));
    cont.appendChild(card);
  }
}

// openDetail — identical to current version
function openDetail(cs, player){
  selectedPlayer=cs;
  document.querySelectorAll('.pcard').forEach(c=>c.classList.toggle('active',c.dataset.cs===cs));
  document.getElementById('dp-cs').textContent=cs;
  const blue=player.coalition==='Friendlies';
  document.getElementById('dp-sub').textContent=`${blue?'🔵 Blue':'🔴 Red'} · ${player.kills.length} kill${player.kills.length!==1?'s':''}`;
  const kEl=document.getElementById('dp-kills'); kEl.innerHTML='';
  if(!player.kills.length){kEl.innerHTML='<div style="color:var(--dim);font-size:11px">No kills</div>';}
  for(const k of player.kills){
    const d=document.createElement('div'); d.className='kill-row';
    d.innerHTML=`<b>${k.victim_name||k.victim_pilot||'?'}</b><span>${(k.weapon||'?').replace(/_/g,' ')} · ${fmtT(k.t)}</span>`;
    if(k.lat&&k.lon){d.style.cursor='pointer';d.addEventListener('click',()=>{seekTo(k.t);map.setView([k.lat,k.lon],12);});}
    kEl.appendChild(d);
  }
  document.getElementById('detail-panel').style.display='block';
}
document.getElementById('close-dp').addEventListener('click',()=>{
  document.getElementById('detail-panel').style.display='none';
  selectedPlayer=null;
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('active'));
});

// ════════════════════════════════════════════════════════════════════
//  TIMELINE
// ════════════════════════════════════════════════════════════════════
function drawTimeline(){
  const sDiv=document.getElementById('tl-sessions'); sDiv.innerHTML='';
  const eDiv=document.getElementById('tl-events');   eDiv.innerHTML='';
  if(!_campaignIndex||!campaignDur) return;
  const sessions=_campaignIndex.session_index||[];
  const BCOLS=['#1f3a5c','#2a1f3f','#1f3a2f','#3a2a1f'];
  sessions.forEach((s,i)=>{
    const x=(s.offset/campaignDur)*100, w=(s.duration/campaignDur)*100;
    const b=document.createElement('div');
    b.style.cssText=`position:absolute;left:${x}%;width:${w}%;height:100%;background:${BCOLS[i%4]}`;
    sDiv.appendChild(b);
    // White session boundary marker (skip first session — no divider at t=0)
    if(i > 0){
      const div=document.createElement('div');
      div.style.cssText=`position:absolute;left:${x}%;width:3px;height:100%;background:#ffffff;transform:translateX(-50%);z-index:10;box-shadow:0 0 4px rgba(255,255,255,0.8)`;
      sDiv.appendChild(div);
    }
    const l=document.createElement('div'); l.className='sess-lbl';
    l.style.left=`${x+w/2}%`; l.textContent=s.date?s.date.slice(5):`S${i+1}`;
    sDiv.appendChild(l);
  });
  // Kill pips from all events
  for(const ev of _allEvents){
    if(ev.type!=='kill'&&ev.type!=='crashed'&&ev.type!=='pilot dead') continue;
    const killerCs=(ev.killer||'').trim();
    const vcs=(ev.victim_pilot||'').replace(/\s*\(\d+\)$/,'').trim();
    let pipColor='#888888';
    if(killerCs&&!/^\d+/.test(killerCs)&&playerColors[killerCs]) pipColor=playerColors[killerCs];
    else if(vcs&&playerColors[vcs]) pipColor=playerColors[vcs];
    const pip=document.createElement('div'); pip.className='tpip';
    pip.style.left=`${(ev.t/campaignDur)*100}%`; pip.style.background=pipColor;
    pip.title=`${ev.victim_name||vcs||'?'} · ${fmtT(ev.t)}`;
    pip.addEventListener('click',()=>seekTo(ev.t));
    eDiv.appendChild(pip);
  }
}

const TRAIL_SECS=3600;

function getActiveSessionIdx(t){
  // Find which session contains time t
  // Sessions are sorted by offset; active session is the last one where offset <= t
  let active = 0;
  for(let i = 0; i < _sessions.length; i++){
    if(_sessions[i]._offset <= t) active = i;
    else break;
  }
  return active;
}

function updateDisplay(rafTs){
  const t = currentTime;

  // Switch active session if needed
  const targetIdx = getActiveSessionIdx(t);
  if(targetIdx !== _activeIdx && _sessions[targetIdx]){
    activateSession(targetIdx, null);
  }

  // Fast path — every frame
  if(_merged)
    for(const [id,track] of Object.entries(_merged.tracks))
      updateUnit(id,track,t);

  updateKills(t);
  updateKillFeedEvents(t);
  updateKillFeed(t);

  // Slow path — throttled
  const now = rafTs || performance.now();
  if(now - _lastSlowUpdate >= SLOW_UPDATE_INTERVAL_MS || !playing){
    _lastSlowUpdate = now;

    let wc = fmtT(t);
    if(_campaignIndex?.session_index){
      const sessions = _campaignIndex.session_index;
      const sess = [...sessions].reverse().find(s => t >= s.offset) || sessions[0];
      if(sess?.reference_time){
        const ms = new Date(sess.reference_time).getTime() + (t - sess.offset) * 1000;
        wc = new Date(ms).toUTCString().slice(5,22) + ' Z';
      }
    }
    document.getElementById('wallclock').textContent = wc;
    document.getElementById('tl-time').textContent = `${fmtT(t)} / ${fmtDur(campaignDur)}`;
    document.getElementById('scrubber').value = t;

    updateBaseOwnership(t);
    updateKillCounter();
    updateHeatmap(t);
  }
}


function updateUnit(id,track,t){
  const obj=_merged?.objects[id]; if(!obj) return;
  if(!isGroundVehicle(obj)) return;
  const mrk=unitMarkers[id]; const poly=unitTrails[id];
  if(!mrk) return;
  if(!filters.ground){
    if(mrk._vis){mrk.setOpacity(0);mrk._vis=false;}
    const gl=groundLabels[id]; if(gl&&gl._vis){map.removeLayer(gl);gl._vis=false;}
    if(poly) for(const p of poly) p.setLatLngs([]);
    return;
  }
  const hideT=unitHideTimes[id];
  if(hideT!=null){
    const elapsed=t-hideT;
    if(elapsed>=60){
      mrk.setOpacity(0);mrk._vis=false;
      const gl=groundLabels[id]; if(gl&&gl._vis){map.removeLayer(gl);gl._vis=false;}
      return;
    } else if(elapsed>0){mrk.setOpacity(Math.max(0,1-elapsed/60));mrk._vis=true;}
  }
  if(t<track[0].t){
    if(t >= (_merged._sessionOffset||0)){
      // Pre-spawn but session is active: show at first known position so map is populated immediately
      mrk.setLatLng([track[0].lat,track[0].lon]);
      if(!mrk._vis){mrk.setOpacity(1);mrk._vis=true;}
    } else {
      if(mrk._vis){mrk.setOpacity(0);mrk._vis=false;}
    }
    if(poly) for(const p of poly) p.setLatLngs([]);
    return;
  }
  const idx=trackIdxAt(track,t,mrk._idx||0); mrk._idx=idx;
  const pt=track[idx];
  mrk.setLatLng([pt.lat,pt.lon]);
  if(!mrk._vis){mrk.setOpacity(1);mrk._vis=true;}
  const glbl=groundLabels[id];
  if(glbl){
    const showLbl=filters.groundLabels&&mrk._vis;
    if(showLbl&&!glbl._vis){glbl.setLatLng([pt.lat,pt.lon]);glbl.addTo(map);glbl._vis=true;}
    else if(!showLbl&&glbl._vis){map.removeLayer(glbl);glbl._vis=false;}
    else if(showLbl){glbl.setLatLng([pt.lat,pt.lon]);}
  }
  if(filters.ground&&poly){
    const tStart=t-TRAIL_SECS;
    let lo=0,hi=idx;
    while(lo<hi){const mid=(lo+hi)>>1;if(track[mid].t<tStart)lo=mid+1;else hi=mid;}
    const rawPts=track.slice(lo,idx+1);
    const TRAIL_SEGS=poly.length;
    if(rawPts.length>=2){
      const segLen=Math.ceil(rawPts.length/TRAIL_SEGS);
      for(let s=0;s<TRAIL_SEGS;s++){
        const chunk=rawPts.slice(s*segLen,s*segLen+segLen+1);
        poly[s].setLatLngs(chunk.length>=2?chunk.map(p=>[p.lat,p.lon]):[]);
      }
    } else {for(const p of poly) p.setLatLngs([]);}
  } else if(poly){for(const p of poly) p.setLatLngs([]);}
}

// updateKills — uses _allEvents for explosions, _activeSession events for feed
function updateKills(t){
  if(!filters.kills) return;
  for(const ev of _allEvents){
    if(ev.type!=='kill'&&ev.type!=='crashed') continue;
    if(!ev.lat||!ev.lon) continue;
    const age=t-ev.t; if(age<0||age>25) continue;
    const key=`${ev.t}_${ev.victim_id}`;
    if(shownKills.has(key)) continue;
    shownKills.add(key);
    const isPlayer=ev.victim_category==='player_air'&&ev.victim_pilot;
    spawnExp(ev.lat,ev.lon,isPlayer);
    const color=isPlayer?'#f85149':'#d29922';
    const dot=L.circleMarker([ev.lat,ev.lon],{radius:3,color,fillColor:color,fillOpacity:.8,weight:1}).addTo(map);
    dot.bindTooltip(`💥 ${ev.victim_name||ev.victim_pilot||'?'}`,{sticky:true});
    killLayers.push(dot);
    const fade=Math.max(5000,25000/Math.max(playSpeed,1));
    setTimeout(()=>{try{map.removeLayer(dot)}catch(e){};shownKills.delete(key);},fade);
  }
}

function updateKillFeedEvents(t){
  const sessEvents = _activeSession?.events || [];
  for(const ev of sessEvents){
    if(ev.type!=='kill') continue;
    const key=`feed_${ev.t}_${ev.victim_id}`;
    if(shownKillFeed.has(key)) continue;
    if(t-ev.t<0||t-ev.t>30) continue;
    shownKillFeed.add(key);
    addKillFeedEntry(ev,ev.t);
  }
}

// ════════════════════════════════════════════════════════════════════
//  KILL HEATMAP (FLOT)
// ════════════════════════════════════════════════════════════════════
let _heatLastT=-9999;
const HEAT_UPDATE_INTERVAL=60;
function updateHeatmap(t){
  if(!filters.heatmap){if(_heatLayer){map.removeLayer(_heatLayer);_heatLayer=null;}return;}
  if(Math.abs(t-_heatLastT)<HEAT_UPDATE_INTERVAL&&_heatLayer) return;
  _heatLastT=t;
  const points=[];
  for(const pt of _killPoints){
    const age=t-pt.t; if(age<0||age>HEAT_FADE_SECS) continue;
    const intensity=Math.pow(1-age/HEAT_FADE_SECS,1.0);
    if(intensity<0.02) continue;
    points.push([pt.lat,pt.lon,intensity]);
  }
  if(_heatLayer) map.removeLayer(_heatLayer);
  if(!points.length){_heatLayer=null;return;}
  _heatLayer=L.heatLayer(points,{
    radius:35,blur:22,maxZoom:12,max:0.8,
    gradient:{0.0:'transparent',0.15:'#0a0a6b',0.35:'#1a3a8c',0.55:'#cc2200',0.75:'#ff4400',0.9:'#ff8800',1.0:'#ffff00'},
    pane:'heatPane',
  }).addTo(map);
  // Lower opacity by 30%
  if(_heatLayer.getPane()) _heatLayer.getPane().style.opacity='0.7';
}

// ════════════════════════════════════════════════════════════════════
//  PLAYBACK
// ════════════════════════════════════════════════════════════════════
let _lastSlowUpdate = -9999;
const SLOW_UPDATE_INTERVAL_MS = 200;
function tick(raf){
  if(!playing) return;
  if(lastRaf!==null){
    const dt=(raf-lastRaf)/1000;
    currentTime=Math.min(currentTime+dt*playSpeed,campaignDur);
    if(currentTime>=campaignDur){currentTime=campaignDur;playing=false;updPlayBtn();}
    updateDisplay(raf);
  }
  lastRaf=raf;
  if(playing) rafId=requestAnimationFrame(tick);
}
function startPlay(){if(currentTime>=campaignDur)currentTime=0;playing=true;lastRaf=null;updPlayBtn();rafId=requestAnimationFrame(tick);}
function pausePlay(){playing=false;lastRaf=null;updPlayBtn();if(rafId)cancelAnimationFrame(rafId);}
function updPlayBtn(){document.getElementById('btn-play').classList.toggle('active',playing);updPauseBtn();}
function updPauseBtn(){document.getElementById('btn-pause').classList.toggle('active',!playing&&currentTime>0&&currentTime<campaignDur);}
function seekTo(t){
  const wasAfter=t<currentTime;
  currentTime=Math.max(0,Math.min(t,campaignDur));
  _heatLastT=-9999; shownKills.clear();
  for(const k of Object.keys(_baseOwnerCache)) delete _baseOwnerCache[k];
  if(wasAfter) shownKillFeed.clear();
  updateDisplay();
}

//  CONTROLS
// ════════════════════════════════════════════════════════════════════
document.getElementById('btn-play').addEventListener('click',()=>{if(!playing)startPlay();});
document.getElementById('btn-pause').addEventListener('click',pausePlay);
document.getElementById('btn-prev').addEventListener('click',()=>{pausePlay();seekTo(0);});
document.getElementById('btn-next').addEventListener('click',()=>{pausePlay();seekTo(campaignDur);});
document.getElementById('scrubber').addEventListener('input',e=>{pausePlay();seekTo(parseFloat(e.target.value));});
document.querySelectorAll('.spdbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.spdbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');playSpeed=parseInt(btn.dataset.spd);
  });
});
document.getElementById('f-ground').addEventListener('change',e=>{filters.ground=e.target.checked;updateDisplay();});
document.getElementById('f-ground-labels').addEventListener('change',e=>{
  filters.groundLabels=e.target.checked;
  for(const [id,glbl] of Object.entries(groundLabels)){
    const marker=unitMarkers[id];
    const show=filters.groundLabels&&marker&&marker._vis;
    if(show&&!glbl._vis){glbl.setLatLng(marker.getLatLng());glbl.addTo(map);glbl._vis=true;}
    else if(!show&&glbl._vis){map.removeLayer(glbl);glbl._vis=false;}
  }
});
document.getElementById('f-kills').addEventListener('change',e=>{filters.kills=e.target.checked;});
document.getElementById('f-heatmap').addEventListener('change',e=>{
  filters.heatmap=e.target.checked;
  if(!filters.heatmap&&_heatLayer){map.removeLayer(_heatLayer);_heatLayer=null;}
  else if(filters.heatmap){_heatLastT=-9999;updateHeatmap(currentTime);}
});
document.getElementById('f-bases').addEventListener('change',e=>{
  filters.bases=e.target.checked;
  for(const m of Object.values(baseMarkers))      filters.bases?m.addTo(map):map.removeLayer(m);
  for(const c of Object.values(baseCircles))      filters.bases?c.addTo(map):map.removeLayer(c);
  for(const l of Object.values(baseLabels))       filters.bases?l.addTo(map):map.removeLayer(l);
  for(const i of Object.values(baseInnerCircles)) filters.bases?i.addTo(map):map.removeLayer(i);
});
document.getElementById('f-bases-only').addEventListener('change',e=>{filters.basesOnly=e.target.checked;applyBaseSubfilters();});
document.getElementById('f-farps-only').addEventListener('change',e=>{filters.farpsOnly=e.target.checked;applyBaseSubfilters();});
function applyBaseSubfilters(){
  if(!filters.bases) return;
  for(const b of _baseList){
    const isFarp=b.isFarp||b.type==='farp'||b.isFactory||b.type==='factory';
    const show=isFarp?filters.farpsOnly:filters.basesOnly;
    const mk=baseMarkers[b.key],ci=baseCircles[b.key],lb=baseLabels[b.key],ic=baseInnerCircles[b.key];
    if(mk) show?mk.addTo(map):map.removeLayer(mk);
    if(ci) show?ci.addTo(map):map.removeLayer(ci);
    if(lb) show?lb.addTo(map):map.removeLayer(lb);
    if(ic) show?ic.addTo(map):map.removeLayer(ic);
  }
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.code==='Space'){e.preventDefault();playing?pausePlay():startPlay();}
  if(e.code==='ArrowRight') seekTo(currentTime+300);
  if(e.code==='ArrowLeft')  seekTo(currentTime-300);
  if(e.code==='ArrowUp')    seekTo(currentTime+1800);
  if(e.code==='ArrowDown')  seekTo(currentTime-1800);
});


(function initUIScale(){
  const slider = document.getElementById('ui-scale');
  const valEl  = document.getElementById('ui-scale-val');
  const SNAP   = 1.0;
  const SNAP_RANGE = 0.06; // within ±0.06 of 1.0 → snap

  function updateTrack(v){
    // Fill left of thumb in accent blue, right in border grey; notch at 1× position
    const pct = (v - 0.5) / (2 - 0.5) * 100;
    const notchPct = (SNAP - 0.5) / (2 - 0.5) * 100;
    slider.style.background = [
      `linear-gradient(to right,`,
      `  var(--accent) 0%, var(--accent) ${pct}%,`,
      `  var(--border) ${pct}%, var(--border) ${notchPct - 0.8}%,`,
      `  #fff          ${notchPct - 0.8}%, #fff ${notchPct + 0.8}%,`,
      `  var(--border) ${notchPct + 0.8}%, var(--border) 100%)`,
    ].join('');
  }

  function applyScale(v){
    UI_SCALE = v;
    const label = Math.abs(v - 1) < 0.01 ? '1×' : v.toFixed(2) + '×';
    valEl.textContent = label;
    updateTrack(v);
    if(_merged){
      // Rebuild ground labels at new scale
      for(const [id, glbl] of Object.entries(groundLabels)){
        const obj = _merged.objects[id]; if(!obj) continue;
        const gclr = obj.coalition === 'Friendlies' ? 'blue' : 'red';
        const gFS = Math.round(11 * UI_SCALE);
        const nm = isSAMUnit(obj) ? samDisplayName(obj.name) : obj.name;
        glbl.setIcon(L.divIcon({html:`<div class="glabel-name ${gclr}" style="font-size:${gFS}px">${nm}</div>`,className:'glabel',iconSize:[120,14],iconAnchor:[-9,7]}));
      }
      // Update label font sizes for all pilot/AI labels
      for(const [id, lbl] of Object.entries(pilotLabels)){
        const obj = _merged.objects[id]; if(!obj) continue;
        const nameEl = lbl.getElement()?.querySelector(`[id="ln-${id}"]`);
        const telemEl = lbl.getElement()?.querySelector(`[id="lt-${id}"]`);
        if(obj.is_human){ if(nameEl) nameEl.style.fontSize=Math.round(16*UI_SCALE)+'px'; if(telemEl) telemEl.style.fontSize=Math.round(12*UI_SCALE)+'px'; }
        else { if(nameEl) nameEl.style.fontSize=Math.round(12*UI_SCALE)+'px'; if(telemEl) telemEl.style.fontSize=Math.round(10*UI_SCALE)+'px'; }
      }
      // Update weapon label font sizes
      for(const [id, lbl] of Object.entries(weaponLabels)){
        const wFS = Math.round(9 * UI_SCALE);
        const nameEl = lbl.getElement()?.querySelector('.wlabel-name');
        const telemEl = lbl.getElement()?.querySelector(`[id="wt-${id}"]`);
        if(nameEl) nameEl.style.fontSize = wFS+'px';
        if(telemEl) telemEl.style.fontSize = wFS+'px';
      }
      // Force icon rebuild for all unit markers via dirty flag
      for(const mrk of Object.values(unitMarkers)){ mrk._lastHdg = undefined; mrk._lastSel = undefined; }
      // Rebuild weapon circle radii
      for(const [id, mrk] of Object.entries(weaponMarkers)){
        mrk.setRadius(Math.max(2, Math.round(3 * UI_SCALE)));
      }
      updateDisplay();
    }
  }

  // Stop map drag events when interacting with slider
  const ctrl = document.getElementById('ui-scale-ctrl');
  L.DomEvent.disableClickPropagation(ctrl);
  L.DomEvent.disableScrollPropagation(ctrl);

  slider.addEventListener('input', () => {
    let v = parseFloat(slider.value);
    if(Math.abs(v - SNAP) < SNAP_RANGE){
      v = SNAP;
      slider.value = SNAP;
    }
    applyScale(v);
  });

  applyScale(1.0); // init track gradient
})();

// Player sort buttons
function setSortMode(byKills){
  _playerSortByKills = byKills;
  const azBtn    = document.getElementById('sort-az-btn');
  const killsBtn = document.getElementById('sort-kills-btn');
  azBtn.style.background    = byKills ? 'none'          : 'var(--accent)';
  azBtn.style.color         = byKills ? 'var(--dim)'    : '#fff';
  killsBtn.style.background = byKills ? 'var(--accent)' : 'none';
  killsBtn.style.color      = byKills ? '#fff'          : 'var(--dim)';
  buildPlayerList(null);
}
